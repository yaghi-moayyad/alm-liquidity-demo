# Optional local integration topology: real PostgreSQL + RabbitMQ + Celery.
# Run python configure_docker.py first. HTTPS/SSO are deployment work, not configured here.
x-app: &app
  build: .
  environment: &environment
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run configure_docker.py first}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DJANGO_SECURE_COOKIES: "0" # local HTTP only; enable behind HTTPS in deployment
    DJANGO_SSL_REDIRECT: "0" # local HTTP only
    DATABASE_ENGINE: postgres
    POSTGRES_DB: liquidity
    POSTGRES_USER: liquidity
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure_docker.py first}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    TASK_BACKEND: celery
    CELERY_BROKER_URL: amqp://liquidity:${RABBITMQ_PASSWORD:?Run configure_docker.py first}@rabbitmq:5672//
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liquidity
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure_docker.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidity -d liquidity"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: liquidity
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run configure_docker.py first}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
  web:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres-data:
  rabbitmq-data:
